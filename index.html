<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Gracefully handle Vite WebSocket / HMR disconnection in preview environments
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e && (e.reason || e.detail && e.detail.reason);
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
          e.preventDefault && e.preventDefault();
          e.stopImmediatePropagation && e.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (e) {
        var msg = (e && (e.message || e.filename || '')) || '';
        if (msg.indexOf('@vite/client') !== -1 || msg.indexOf('WebSocket') !== -1) {
          e.preventDefault && e.preventDefault();
          e.stopImmediatePropagation && e.stopImmediatePropagation();
        }
      });
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
